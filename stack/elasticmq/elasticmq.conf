# ElasticMQ: an open-source, SQS-compatible queue. Locally it stands in for the real
# EventBridge rule -> SQS queue that receives "EC2 Instance State-change Notification" events.
include classpath("application.conf")

node-address { protocol = http, host = elasticmq, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
rest-stats { enabled = true, bind-port = 9325, bind-hostname = "0.0.0.0" }

queues {
  # Poison messages land here after 5 failed receives (SQS redrive policy).
  ec2-state-change-dlq { }
  ec2-state-change {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "ec2-state-change-dlq", maxReceiveCount = 5 }
  }
}

aws { region = us-east-1, accountId = "000000000000" }
